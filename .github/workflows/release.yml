name: ArchInfo Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux Matrix
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            archive_name: archinfo-{version}-linux-x86_64.tar.zst
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            archive_name: archinfo-{version}-linux-aarch64.tar.zst
          - os: ubuntu-24.04-riscv
            target: riscv64gc-unknown-linux-gnu
            archive_name: archinfo-{version}-linux-riscv64.tar.zst

          # Windows Matrix
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            archive_name: archinfo-{version}-windows-x86_64.tar.zst
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            archive_name: archinfo-{version}-windows-aarch64.tar.zst

          # macOS Matrix
          - os: xcode-27
            target: aarch64-apple-darwin
            archive_name: archinfo-{version}-macos-aarch64.tar.zst

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Extract Cargo Version
        id: archive
        shell: bash
        run: |
          VERSION=$(sed -E -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1 | tr -d '\r')
          ARCHIVE_NAME=$(echo "${{ matrix.archive_name }}" | sed "s/{version}/$VERSION/")
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      # Sets up the appropriate native Rust toolchain
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Automatically optimizes actions runners by storing and restoring compiler caches
      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: ${{ matrix.target }}

      # Ensure zstd and compression tools are available across platforms
      - name: Install Dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update && sudo apt-get install -y zstd

      - name: Install Dependencies (macOS)
        if: startsWith(matrix.os, 'xcode') || startsWith(matrix.os, 'macos')
        run: |
          which zstd || brew install zstd

      - name: Install Dependencies (Windows)
        if: startsWith(matrix.os, 'windows-')
        uses: msys2/setup-msys2@v2
        continue-on-error: true
        with:
          install: zstd tar

      - name: Compile ArchInfo Binary
        run: cargo build --release --target ${{ matrix.target }}

      # Grabs executable, staging docs, and compresses using Zstandard
      - name: Package and Compress Asset
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.archive.outputs.archive_name }}
        run: |
          # 1. Create a clean temporary staging directory
          mkdir -p dist
          
          # 2. Copy the binary based on OS naming constraints
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp target/${{ matrix.target }}/release/archinfo.exe ./dist/archinfo.exe
          else
            cp target/${{ matrix.target }}/release/archinfo ./dist/archinfo
          fi

          # 3. Include license and documentation
          cp LICENSE README.md ./dist/ 2>/dev/null || true
          
          # 4. Compress using tar with zstd compression engine (-a enables auto-compression by extension)
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            if [ -d "/c/msys64/usr/bin" ]; then
              export PATH="/c/msys64/usr/bin:$PATH"
            fi
            if command -v tar.exe >/dev/null 2>&1; then
              tar.exe -acvf "$ARCHIVE_NAME" -C dist .
            else
              tar -acvf "$ARCHIVE_NAME" -C dist .
            fi
          else
            tar -acvf "$ARCHIVE_NAME" -C dist .
          fi

          # 5. Generate SHA256 checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

      # Automatically creates/updates GitHub Release page and pushes compressed assets & checksums
      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.archive.outputs.archive_name }}
            ${{ steps.archive.outputs.archive_name }}.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
